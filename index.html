    <section class="profile">

      </figure>

      <div class="crest" aria-hidden="true">

  <script>
    // 头像文件还没放进来时，自动显示渐变底 + 名字，避免出现破图图标
    (function () {
      var avatar = document.querySelector('.avatar');
      var img = document.querySelector('.avatar__img');

      function showFallback() {
        avatar.classList.add('is-missing');
      }

      img.addEventListener('error', showFallback);
      if (img.complete && img.naturalWidth === 0) showFallback();
    })();

    // 背景视频：自动播放失败时重试；系统开启“减少动态效果”时暂停
    (function () {
      var v = document.querySelector('.bg-video');
      if (!v) return;

      v.muted = true;

      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        v.removeAttribute('autoplay');
        v.pause();
        return;
      }

      function play() {
        var p = v.play();
        if (p && p.catch) p.catch(function () {});
      }

      play();
      v.addEventListener('canplay', play, { once: true });
    })();

    // 模糊区块的位置 / 大小调节
    //   setBand(20, 80)                        -> 左边线 20%、右边线 80%（数字=视口宽度百分比）
    //   setBand('320px', '960px')              -> 也可直接给带单位的 CSS 长度
    //   setBandBox({ top: 5, bottom: 5 })      -> 纵向位置（数字=视口高度百分比）
    //   setBandSize(40, 90, 30, 5)             -> 宽 40%、高 90%、左 30%、上 5%
    //   getBandBox()                           -> 读取 { left, right, top, bottom }
    //   resetBand()                            -> 恢复 style.css 里的默认值
    window.setBand = function (left, right) {
      var root = document.documentElement;

      function toCss(v) {
        return typeof v === 'number' ? Math.max(0, Math.min(100, v)) + '%' : String(v);
      }

      if (left !== undefined && left !== null) root.style.setProperty('--band-left', toCss(left));
      if (right !== undefined && right !== null) root.style.setProperty('--band-right', toCss(right));
      return window.getBandBox();
    };

    window.setBandBox = function (box) {
      var root = document.documentElement;

      function toCss(v) {
        return typeof v === 'number' ? Math.max(0, Math.min(100, v)) + '%' : String(v);
      }

      if (!box) return window.getBandBox();
      if (box.left != null) root.style.setProperty('--band-left', toCss(box.left));
      if (box.right != null) root.style.setProperty('--band-right', toCss(box.right));
      if (box.top != null) root.style.setProperty('--band-top', toCss(box.top));
      if (box.bottom != null) root.style.setProperty('--band-bottom', toCss(box.bottom));
      return window.getBandBox();
    };

    // 用「宽 + 高 + 左 + 上」来定：数字都是百分比
    window.setBandSize = function (width, height, left, top) {
      left = left == null ? 0 : left;
      top = top == null ? 0 : top;
      return window.setBandBox({
        left: left,
        right: left + width,
        top: top,
        bottom: top + height
      });
    };

    window.getBandBox = function () {
      var cs = getComputedStyle(document.documentElement);
      return {
        left: cs.getPropertyValue('--band-left').trim(),
        right: cs.getPropertyValue('--band-right').trim(),
        top: cs.getPropertyValue('--band-top').trim(),
        bottom: cs.getPropertyValue('--band-bottom').trim()
      };
    };

    window.resetBand = function () {
      var root = document.documentElement;
      root.style.removeProperty('--band-left');
      root.style.removeProperty('--band-right');
      root.style.removeProperty('--band-top');
      root.style.removeProperty('--band-bottom');
      return window.getBandBox();
    };
  </script>
