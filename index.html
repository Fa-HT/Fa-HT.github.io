<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Fa_HT</title>
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>

  <!-- 背景视频：静音自动循环，铺满整屏 -->
  <video class="bg-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
    <source src="bg.mp4" type="video/mp4">
  </video>
  <div class="bg-shade" aria-hidden="true"></div>

  <!-- 两条竖线之间的模糊带：将来在这里放可交互 UI -->
  <div class="ui-band" id="uiBand">
    <div class="ui-band__blur" aria-hidden="true"></div>
    <div class="ui-band__frame" aria-hidden="true"></div>
    <div class="ui-band__inner" id="uiBandInner">
      <!-- 可交互内容放这里 -->
    </div>
  </div>

  <main class="stage">
    <!-- 书签横幅：横贯整块模糊区域，把头像、纹章和名字分散串起来 -->
    <div class="bookmark" aria-hidden="true"></div>

    <section class="profile">
      <figure class="avatar">
        <div class="avatar__inner">
          <span class="avatar__glow" aria-hidden="true"></span>
          <span class="avatar__ring" aria-hidden="true"></span>

          <div class="avatar__frame">
            <!-- 头像文件：Fa-HT.png，与本文件同级目录 -->
            <img class="avatar__img" src="Fa-HT.png" alt="Fa-HT 的头像" width="260" height="260" decoding="async">
            <span class="avatar__fallback" aria-hidden="true">Fa-HT</span>
          </div>
        </div>
      </figure>

      <div class="crest" aria-hidden="true">
        <svg viewBox="0 0 64 80" focusable="false">
          <defs>
            <linearGradient id="crestGold" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff6e0" />
              <stop offset="50%" stop-color="#e8c98a" />
              <stop offset="100%" stop-color="#b8862f" />
            </linearGradient>
          </defs>
          <path d="M32 3 L58 11 V40 C58 57 46 70 32 76 C18 70 6 57 6 40 V11 Z"
                fill="rgba(18,7,12,0.7)" stroke="url(#crestGold)" stroke-width="2.6" />
          <path d="M32 16 V64" fill="none" stroke="#f2dcae" stroke-width="4" stroke-linecap="round" />
          <path d="M16 30 H48" fill="none" stroke="#f2dcae" stroke-width="3.4" stroke-linecap="round" />
          <path d="M24 46 H40" fill="none" stroke="#e8c98a" stroke-width="2" stroke-linecap="round" opacity="0.7" />
        </svg>
      </div>

      <h1 class="name">Fa-HT</h1>
    </section>
  </main>

  <script>
    // 头像文件还没放进来时，自动显示渐变底 + 名字，避免出现破图图标
    (function () {
      var avatar = document.querySelector('.avatar');
      var img = document.querySelector('.avatar__img');

      function showFallback() {
        avatar.classList.add('is-missing');
      }

      img.addEventListener('error', showFallback);
      if (img.complete && img.naturalWidth === 0) showFallback();
    })();

    // 背景视频：自动播放失败时重试；系统开启“减少动态效果”时暂停
    (function () {
      var v = document.querySelector('.bg-video');
      if (!v) return;

      v.muted = true;

      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        v.removeAttribute('autoplay');
        v.pause();
        return;
      }

      function play() {
        var p = v.play();
        if (p && p.catch) p.catch(function () {});
      }

      play();
      v.addEventListener('canplay', play, { once: true });
    })();

    // 模糊区块的位置 / 大小调节
    //   setBand(20, 80)                        -> 左边线 20%、右边线 80%（数字=视口宽度百分比）
    //   setBand('320px', '960px')              -> 也可直接给带单位的 CSS 长度
    //   setBandBox({ top: 5, bottom: 5 })      -> 纵向位置（数字=视口高度百分比）
    //   setBandSize(40, 90, 30, 5)             -> 宽 40%、高 90%、左 30%、上 5%
    //   getBandBox()                           -> 读取 { left, right, top, bottom }
    //   resetBand()                            -> 恢复 style.css 里的默认值
    window.setBand = function (left, right) {
      var root = document.documentElement;

      function toCss(v) {
        return typeof v === 'number' ? Math.max(0, Math.min(100, v)) + '%' : String(v);
      }

      if (left !== undefined && left !== null) root.style.setProperty('--band-left', toCss(left));
      if (right !== undefined && right !== null) root.style.setProperty('--band-right', toCss(right));
      return window.getBandBox();
    };

    window.setBandBox = function (box) {
      var root = document.documentElement;

      function toCss(v) {
        return typeof v === 'number' ? Math.max(0, Math.min(100, v)) + '%' : String(v);
      }

      if (!box) return window.getBandBox();
      if (box.left != null) root.style.setProperty('--band-left', toCss(box.left));
      if (box.right != null) root.style.setProperty('--band-right', toCss(box.right));
      if (box.top != null) root.style.setProperty('--band-top', toCss(box.top));
      if (box.bottom != null) root.style.setProperty('--band-bottom', toCss(box.bottom));
      return window.getBandBox();
    };

    // 用「宽 + 高 + 左 + 上」来定：数字都是百分比
    window.setBandSize = function (width, height, left, top) {
      left = left == null ? 0 : left;
      top = top == null ? 0 : top;
      return window.setBandBox({
        left: left,
        right: left + width,
        top: top,
        bottom: top + height
      });
    };

    window.getBandBox = function () {
      var cs = getComputedStyle(document.documentElement);
      return {
        left: cs.getPropertyValue('--band-left').trim(),
        right: cs.getPropertyValue('--band-right').trim(),
        top: cs.getPropertyValue('--band-top').trim(),
        bottom: cs.getPropertyValue('--band-bottom').trim()
      };
    };

    window.resetBand = function () {
      var root = document.documentElement;
      root.style.removeProperty('--band-left');
      root.style.removeProperty('--band-right');
      root.style.removeProperty('--band-top');
      root.style.removeProperty('--band-bottom');
      return window.getBandBox();
    };
  </script>

</body>
</html>
