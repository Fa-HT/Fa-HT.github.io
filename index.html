<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Fa_HT</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

  <main class="stage">
    <section class="profile">
      <figure class="avatar">
        <span class="avatar__glow" aria-hidden="true"></span>
        <span class="avatar__ring" aria-hidden="true"></span>

        <div class="avatar__frame">
          <!-- 头像文件：Fa-HT.png，与本文件同级目录 -->
          <img class="avatar__img" src="Fa-HT.png" alt="Fa-HT 的头像" width="260" height="260" decoding="async">
          <span class="avatar__fallback" aria-hidden="true">Fa-HT</span>
        </div>
      </figure>

      <h1 class="name">Fa-HT</h1>
    </section>
  </main>

  <script>
    // 头像文件还没放进来时，自动显示渐变底 + 名字，避免出现破图图标
    (function () {
      var avatar = document.querySelector('.avatar');
      var img = document.querySelector('.avatar__img');

      function showFallback() {
        avatar.classList.add('is-missing');
      }

      img.addEventListener('error', showFallback);
      if (img.complete && img.naturalWidth === 0) showFallback();
    })();
  </script>

</body>
</html>
