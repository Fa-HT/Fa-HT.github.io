  <script>
    // 头像文件还没放进来时，自动显示渐变底 + 名字，避免出现破图图标
    (function () {
      var avatar = document.querySelector('.avatar');
      var img = document.querySelector('.avatar__img');

      function showFallback() {
        avatar.classList.add('is-missing');
      }

      img.addEventListener('error', showFallback);
      if (img.complete && img.naturalWidth === 0) showFallback();
    })();

    // 背景视频：自动播放失败时重试；系统开启“减少动态效果”时暂停
    (function () {
      var v = document.querySelector('.bg-video');
      if (!v) return;

      v.muted = true;

      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        v.removeAttribute('autoplay');
        v.pause();
        return;
      }

      function play() {
        var p = v.play();
        if (p && p.catch) p.catch(function () {});
      }

      play();
      v.addEventListener('canplay', play, { once: true });
    })();

    // 模糊区块的位置 / 大小调节
    //   setBand(20, 80)                        -> 左边线 20%、右边线 80%（数字=视口宽度百分比）
    //   setBand('320px', '960px')              -> 也可直接给带单位的 CSS 长度
    //   setBandBox({ top: 5, bottom: 5 })      -> 纵向位置（数字=视口高度百分比）
    //   setBandSize(40, 90, 30, 5)             -> 宽 40%、高 90%、左 30%、上 5%
    //   getBandBox()                           -> 读取 { left, right, top, bottom }
    //   resetBand()                            -> 恢复 style.css 里的默认值
    window.setBand = function (left, right) {
      var root = document.documentElement;

      function toCss(v) {
        return typeof v === 'number' ? Math.max(0, Math.min(100, v)) + '%' : String(v);
      }

      if (left !== undefined && left !== null) root.style.setProperty('--band-left', toCss(left));
      if (right !== undefined && right !== null) root.style.setProperty('--band-right', toCss(right));
      return window.getBandBox();
    };

    window.setBandBox = function (box) {
      var root = document.documentElement;

      function toCss(v) {
        return typeof v === 'number' ? Math.max(0, Math.min(100, v)) + '%' : String(v);
      }

      if (!box) return window.getBandBox();
      if (box.left != null) root.style.setProperty('--band-left', toCss(box.left));
      if (box.right != null) root.style.setProperty('--band-right', toCss(box.right));
      if (box.top != null) root.style.setProperty('--band-top', toCss(box.top));
      if (box.bottom != null) root.style.setProperty('--band-bottom', toCss(box.bottom));
      return window.getBandBox();
    };

    // 用「宽 + 高 + 左 + 上」来定：数字都是百分比
    window.setBandSize = function (width, height, left, top) {
      left = left == null ? 0 : left;
      top = top == null ? 0 : top;
      return window.setBandBox({
        left: left,
        right: left + width,
        top: top,
        bottom: top + height
      });
    };

    window.getBandBox = function () {
      var cs = getComputedStyle(document.documentElement);
      return {
        left: cs.getPropertyValue('--band-left').trim(),
        right: cs.getPropertyValue('--band-right').trim(),
        top: cs.getPropertyValue('--band-top').trim(),
        bottom: cs.getPropertyValue('--band-bottom').trim()
      };
    };

    window.resetBand = function () {
      var root = document.documentElement;
      root.style.removeProperty('--band-left');
      root.style.removeProperty('--band-right');
      root.style.removeProperty('--band-top');
      root.style.removeProperty('--band-bottom');
      return window.getBandBox();
    };

    // 模糊带内的界面切换：主界面 ⇄ 下载界面（只在带内变化）
    (function () {
      var inner = document.getElementById('uiBandInner');
      var enter = document.getElementById('dlEnter');
      var back = document.getElementById('dlBack');
      var mainView = document.getElementById('dlMainView');
      var dlView = document.getElementById('dlView');
      if (!inner || !enter || !back) return;

      // 书签与头像/名字从右往左烧掉：逐帧推进 --burn，同时沿边界喷出带物理扩散的火星
      var burnRAF = 0;
      var burnParticles = [];
      var burnCanvas = document.querySelector('.burn-canvas');
      var burnCtx = burnCanvas ? burnCanvas.getContext('2d') : null;
      var burnGeom = null;

      function setBurn(value) {
        document.documentElement.style.setProperty('--burn', value + '%');
      }

      function clearEmbers() {
        burnParticles.length = 0;
        if (burnCtx) burnCtx.clearRect(0, 0, burnCanvas.width, burnCanvas.height);
      }

      function stopBurn() {
        window.cancelAnimationFrame(burnRAF);
        burnRAF = 0;
        clearEmbers();
      }

      function measureBurn() {
        if (!burnCanvas || !burnCtx) return null;
        var box = burnCanvas.getBoundingClientRect();
        var dpr = Math.min(2, window.devicePixelRatio || 1);
        var w = Math.max(1, Math.round(box.width * dpr));
        var h = Math.max(1, Math.round(box.height * dpr));
        if (burnCanvas.width !== w || burnCanvas.height !== h) {
          burnCanvas.width = w;
          burnCanvas.height = h;
        }
        burnCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        var ribbon = document.querySelector('.bookmark');
        var r = ribbon ? ribbon.getBoundingClientRect() : null;
        return {
          w: box.width,
          h: box.height,
          top: r ? r.top - box.top : box.height * 0.4,
          height: r ? r.height : box.height * 0.12
        };
      }

      // 沿烧蚀边界持续喷出火星：速度带随机扩散、重力、空气阻力与湍流
      function spawnEmbers(burn, dt) {
        if (!burnGeom || burn <= -12) return;
        var edge = burnGeom.w * (burn / 100);
        var count = Math.min(22, Math.round(420 * dt));
        for (var i = 0; i < count; i++) {
          var angle = (-Math.PI / 2) + (Math.random() - 0.5) * 2.2;
          var speed = 30 + Math.random() * 200;
          burnParticles.push({
            x: edge + (Math.random() - 0.5) * 12,
            y: burnGeom.top + Math.random() * burnGeom.height + (Math.random() - 0.5) * 14,
            vx: Math.cos(angle) * speed + 40 + Math.random() * 70 - (Math.random() < 0.18 ? 110 : 0),
            vy: Math.sin(angle) * speed,
            size: 0.9 + Math.random() * 3.0,
            life: 0.5 + Math.random() * 0.8,
            age: 0,
            seed: Math.random() * 6.283,
            streak: Math.random() < 0.3
          });
        }
      }

      function stepEmbers(dt) {
        if (!burnCtx) return;
        burnCtx.clearRect(0, 0, burnCanvas.width, burnCanvas.height);
        if (!burnParticles.length) return;
        burnCtx.globalCompositeOperation = 'lighter';
        for (var i = burnParticles.length - 1; i >= 0; i--) {
          var p = burnParticles[i];
          p.age += dt;
          if (p.age >= p.life) {
            burnParticles.splice(i, 1);
            continue;
          }
          p.vy += 150 * dt;
          var drag = Math.exp(-1.6 * dt);
          p.vx *= drag;
          p.vy *= drag;
          p.vx += Math.sin(p.age * 9 + p.seed) * 26 * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;

          var t = p.age / p.life;
          var a = Math.pow(1 - t, 0.8) * Math.min(1, t * 7);
          var radius = Math.max(0.35, p.size * (1 - 0.5 * t));

          if (p.streak) {
            var sp = Math.hypot(p.vx, p.vy) || 1;
            burnCtx.strokeStyle = 'rgba(255,196,110,' + (a * 0.9).toFixed(3) + ')';
            burnCtx.lineWidth = Math.max(0.7, radius * 1.1);
            burnCtx.beginPath();
            burnCtx.moveTo(p.x, p.y);
            burnCtx.lineTo(p.x - (p.vx / sp) * radius * 5, p.y - (p.vy / sp) * radius * 5);
            burnCtx.stroke();
          }

          burnCtx.fillStyle = 'rgba(255,142,52,' + (a * 0.18).toFixed(3) + ')';
          burnCtx.beginPath(); burnCtx.arc(p.x, p.y, radius * 2.6, 0, Math.PI * 2); burnCtx.fill();

          burnCtx.fillStyle = 'rgba(255,196,110,' + (a * 0.45).toFixed(3) + ')';
          burnCtx.beginPath(); burnCtx.arc(p.x, p.y, radius * 1.45, 0, Math.PI * 2); burnCtx.fill();

          burnCtx.fillStyle = 'rgba(255,246,214,' + (a * 0.98).toFixed(3) + ')';
          burnCtx.beginPath(); burnCtx.arc(p.x, p.y, radius, 0, Math.PI * 2); burnCtx.fill();
        }
      }

      function playBurn() {
        stopBurn();
        burnGeom = measureBurn();
        var from = 130;
        var to = -30;
        var duration = 1050;
        var start = window.performance.now();
        var last = start;
        function frame(now) {
          var dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000));
          last = now;
          var p = Math.min(1, (now - start) / duration);
          var eased = p < 0.5
            ? 4 * p * p * p
            : 1 - Math.pow(-2 * p + 2, 3) / 2;
          var value = from + (to - from) * eased;
          setBurn(value);
          spawnEmbers(value, dt);
          stepEmbers(dt);
          if (p < 1 || burnParticles.length) {
            burnRAF = window.requestAnimationFrame(frame);
          } else {
            burnRAF = 0;
          }
        }
        burnRAF = window.requestAnimationFrame(frame);
      }

      function showDownload(on) {
        if (on) {
          playBurn();
        } else {
          stopBurn();
          setBurn(130);
        }
        inner.classList.toggle('is-download', on);
        document.body.classList.toggle('is-download-page', on);
        enter.setAttribute('aria-expanded', on ? 'true' : 'false');
        if (mainView) mainView.setAttribute('aria-hidden', on ? 'true' : 'false');
        if (dlView) dlView.setAttribute('aria-hidden', on ? 'false' : 'true');

        var target = on ? back : enter;
        window.requestAnimationFrame(function () {
          if (inner.classList.contains('is-download') === on) {
            target.focus({ preventScroll: true });
          }
        });
      }

      enter.addEventListener('click', function () {
        showDownload(true);
      });

      back.addEventListener('click', function () {
        showDownload(false);
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && inner.classList.contains('is-download')) {
          showDownload(false);
        }
      });
    })();
  </script>
