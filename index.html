<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Fa_HT</title>
  <link rel="stylesheet" href="style.css?v=16">
</head>
<body>

  <!-- 背景视频：静音自动循环，铺满整屏 -->
  <video class="bg-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
    <source src="bg.mp4" type="video/mp4">
  </video>
  <div class="bg-shade" aria-hidden="true"></div>

  <!-- 复用的角部装饰图形：模糊区块下方左右两角共用 -->
  <svg class="ornament-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="cnWash" cx="0" cy="1" r="1">
        <stop offset="0" stop-color="rgba(240, 206, 150, 0.2)" />

        <stop offset="1" stop-color="rgba(240, 206, 150, 0)" />
      </radialGradient>
      <linearGradient id="cnGold" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="rgba(240, 214, 160, 0.9)" />
        <stop offset="1" stop-color="rgba(240, 214, 160, 0)" />
      </linearGradient>
      <linearGradient id="cnBlue" x1="0" y1="0" x2="0.9" y2="1">
        <stop offset="0" stop-color="#e2f4ff" />
        <stop offset="0.3" stop-color="#8ecbf2" />
        <stop offset="0.65" stop-color="#3576bd" />
        <stop offset="1" stop-color="#0c274b" />

    </defs>
    <symbol id="cnCornerArt" viewBox="0 0 240 240">

      <path d="M168 240 H10" stroke="rgba(240, 214, 160, 0.5)" stroke-width="1" />

        <polygon points="0,-10 6.2,-1 0,10 -6.2,-1" fill="none" stroke="rgba(240, 214, 160, 0.8)" stroke-width="1" />
        <polygon points="0,-10 5.2,0 0,10 -5.2,0" fill="url(#cnBlue)" />

      </g>
      <g transform="translate(84 156)">
        <polygon points="0,-7.2 4.5,-1 0,7.2 -4.5,-1" fill="none" stroke="rgba(240, 214, 160, 0.62)" stroke-width="0.9" />
        <polygon points="0,-7.2 3.7,0 0,7.2 -3.7,0" fill="url(#cnBlue)" />
        <polygon points="0,-7.2 0,0 -3.7,0" fill="rgba(255, 255, 255, 0.34)" />
      </g>
      <g transform="translate(116 124)">
        <polygon points="0,-4.8 3,-1 0,4.8 -3,-1" fill="none" stroke="rgba(240, 214, 160, 0.5)" stroke-width="0.8" />
        <polygon points="0,-4.8 2.5,0 0,4.8 -2.5,0" fill="url(#cnBlue)" opacity="0.92" />

    </symbol>
  </svg>

  <!-- 两条竖线之间的模糊带：将来在这里放可交互 UI -->
  <div class="ui-band" id="uiBand">
    <div class="ui-band__blur" aria-hidden="true"></div>
    <div class="ui-band__frame" aria-hidden="true"></div>

    <!-- 模糊区块下方两角：宝石射线，左右镜像 -->
    <div class="ui-band__ornament ui-band__ornament--left" aria-hidden="true">
      <svg viewBox="0 0 240 240" focusable="false">
        <use href="#cnCornerArt" />
      </svg>
    </div>
    <div class="ui-band__ornament ui-band__ornament--right" aria-hidden="true">
      <svg viewBox="0 0 240 240" focusable="false">
        <use href="#cnCornerArt" />
      </svg>
    </div>
    <div class="ui-band__inner" id="uiBandInner">
      <!-- 主界面：居中的下载入口 -->
      <section class="band-view band-view--main" id="dlMainView" aria-label="Home">
        <button class="dl-entry" id="dlEnter" type="button" aria-controls="dlView" aria-expanded="false">
          <span class="dl-entry__mark" aria-hidden="true">
            <svg viewBox="0 0 28 28" focusable="false">
              <path d="M14 4.8v12.4" />
              <path d="M9.1 12.8 14 17.7l4.9-4.9" />
              <path d="M8.2 23h11.6" />
            </svg>
          </span>
          <span class="dl-entry__title">Download</span>
          <span class="dl-entry__note">Latest release</span>
        </button>
      </section>

      <!-- 下载界面：暂时留空，只保留左上角返回 -->
      <section class="band-view band-view--download" id="dlView" aria-label="Download" aria-hidden="true">
        <button class="dl-back" id="dlBack" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M10.2 3.4 5.8 8l4.4 4.6" />
          </svg>
          <span>Back</span>
        </button>
      </section>
    </div>
  </div>

  <main class="stage">
    <!-- 书签横幅：横贯整块模糊区域，把头像和名字分散串起来 -->
    <div class="bookmark" aria-hidden="true">
      <div class="bookmark__trim">
        <!-- 左端：头像左侧的纹章式宝石饰件，整体收在头像左边缘以内 -->
        <svg class="bookmark__seal" viewBox="0 0 100 120" preserveAspectRatio="xMinYMid meet" focusable="false">
      <defs>
        <linearGradient id="swGold" x1="0" y1="0" x2="0.4" y2="1">
          <stop offset="0" stop-color="#fff4d9" /><stop offset="0.45" stop-color="#e6c284" /><stop offset="1" stop-color="#a5742a" />
        </linearGradient>
        <linearGradient id="swBlue" x1="0" y1="0" x2="0.9" y2="1">
          <stop offset="0" stop-color="#eaf7ff" /><stop offset="0.3" stop-color="#9fd4f4" /><stop offset="0.65" stop-color="#3f86c8" /><stop offset="1" stop-color="#102c50" />
        </linearGradient>
        <radialGradient id="swGlow">
          <stop offset="0" stop-color="rgba(120,190,255,0.3)" /><stop offset="0.6" stop-color="rgba(120,190,255,0.08)" /><stop offset="1" stop-color="rgba(120,190,255,0)" />
        </radialGradient>
      </defs>
      <ellipse cx="46" cy="60" rx="46" ry="26" fill="url(#swGlow)" />
      <path d="M0.8 60 H6" stroke="url(#swGold)" stroke-width="1.6" />
      <polygon points="2,57 5,60 2,63 -1,60" fill="url(#swGold)" />
      <polygon points="4,60 38,39 87,60 38,81" fill="rgba(20,7,12,0.55)" stroke="url(#swGold)" stroke-width="1.7" />
      <polygon points="12,60 38,45 79,60 38,75" fill="none" stroke="rgba(240,214,160,0.32)" stroke-width="0.8" />
      <g>
        <polygon points="12,60 38,45 79,60 38,75" fill="url(#swBlue)" />
        <polygon points="12,60 38,45 38,60" fill="rgba(255,255,255,0.4)" />
        <polygon points="38,45 79,60 38,60" fill="rgba(255,255,255,0.13)" />
        <polygon points="12,60 38,60 38,75" fill="rgba(10,32,60,0.34)" />
        <polygon points="79,60 38,60 38,75" fill="rgba(6,20,40,0.52)" />
        <path d="M14 60 H77 M38 47 V73" stroke="rgba(255,255,255,0.34)" stroke-width="0.7" />
        <polygon points="26,55 33,52 38,56 31,60" fill="rgba(255,255,255,0.78)" />
      </g>
    </svg>

        <!-- 右段空位：由大到小的蓝宝石饰带 -->
        <svg class="bookmark__gems" viewBox="0 0 200 80" focusable="false">
          <defs>
            <linearGradient id="bmRail" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="rgba(240, 214, 160, 0)" />
              <stop offset="0.18" stop-color="rgba(240, 214, 160, 0.55)" />
              <stop offset="0.8" stop-color="rgba(240, 214, 160, 0.5)" />
              <stop offset="1" stop-color="rgba(240, 214, 160, 0)" />
            </linearGradient>
            <linearGradient id="bmBlue" x1="0" y1="0" x2="0.9" y2="1">
              <stop offset="0" stop-color="#e6f6ff" />
              <stop offset="0.28" stop-color="#9bd4f6" />
              <stop offset="0.62" stop-color="#3d82c9" />
              <stop offset="1" stop-color="#0e2b52" />
            </linearGradient>
            <radialGradient id="bmGlow">
              <stop offset="0" stop-color="rgba(96, 178, 255, 0.5)" />
              <stop offset="1" stop-color="rgba(96, 178, 255, 0)" />
            </radialGradient>
          </defs>

          <ellipse cx="64" cy="40" rx="50" ry="27" fill="url(#bmGlow)" />
          <path d="M4 40 H196" stroke="url(#bmRail)" stroke-width="1.3" />
          <path d="M4 42.4 H196" stroke="rgba(0, 0, 0, 0.35)" stroke-width="1" />

          <g transform="translate(26 40)">
            <polygon points="0,-4.6 2.9,-0.6 0,4.6 -2.9,-0.6" fill="none" stroke="rgba(240, 214, 160, 0.55)" stroke-width="0.9" />
            <polygon points="0,-4.6 2.4,0 0,4.6 -2.4,0" fill="url(#bmBlue)" />
          </g>
          <g transform="translate(64 40)">
            <polygon points="0,-19.5 12,-2 0,19.5 -12,-2" fill="none" stroke="rgba(240, 214, 160, 0.82)" stroke-width="1.1" />
            <polygon points="0,-19.5 10.1,0 0,19.5 -10.1,0" fill="url(#bmBlue)" />
            <polygon points="0,-19.5 0,0 -10.1,0" fill="rgba(255, 255, 255, 0.44)" />
            <polygon points="0,19.5 0,0 10.1,0" fill="rgba(3, 14, 32, 0.52)" />
            <polygon points="0,-19.5 2.6,-11.2 0,-5.8 -2.6,-11.2" fill="rgba(255, 255, 255, 0.9)" />
          </g>
          <g transform="translate(118 40)">
            <polygon points="0,-13 8,-1.3 0,13 -8,-1.3" fill="none" stroke="rgba(240, 214, 160, 0.7)" stroke-width="0.9" />
            <polygon points="0,-13 6.8,0 0,13 -6.8,0" fill="url(#bmBlue)" />
            <polygon points="0,-13 0,0 -6.8,0" fill="rgba(255, 255, 255, 0.36)" />
            <polygon points="0,13 0,0 6.8,0" fill="rgba(3, 14, 32, 0.45)" />
          </g>
          <g transform="translate(158 40)">
            <polygon points="0,-8.6 5.3,-0.9 0,8.6 -5.3,-0.9" fill="none" stroke="rgba(240, 214, 160, 0.6)" stroke-width="0.9" />
            <polygon points="0,-8.6 4.5,0 0,8.6 -4.5,0" fill="url(#bmBlue)" />
            <polygon points="0,-8.6 0,0 -4.5,0" fill="rgba(255, 255, 255, 0.3)" />
          </g>
          <g transform="translate(182 40)">
            <polygon points="0,-5.4 3.4,-0.7 0,5.4 -3.4,-0.7" fill="none" stroke="rgba(240, 214, 160, 0.5)" stroke-width="0.8" />
            <polygon points="0,-5.4 2.7,0 0,5.4 -2.7,0" fill="url(#bmBlue)" opacity="0.95" />
          </g>

          <g fill="rgba(240, 214, 160, 0.75)">
            <polygon points="92,38.4 93.6,40 92,41.6 90.4,40" />
            <polygon points="140,38.4 141.6,40 140,41.6 138.4,40" />
            <polygon points="170,38.9 171.1,40 170,41.1 168.9,40" />
          </g>
          <polygon points="184,24 198,40 184,56" fill="rgba(240, 214, 160, 0.12)" stroke="rgba(240, 214, 160, 0.4)" stroke-width="0.8" />
          <path d="M2 32 L12 40 L2 48" fill="none" stroke="rgba(240, 214, 160, 0.35)" stroke-width="0.9" />
        </svg>
      </div>
    </div>

    <section class="profile">
      <figure class="avatar">
        <div class="avatar__inner">
          <span class="avatar__glow" aria-hidden="true"></span>
          <span class="avatar__ring" aria-hidden="true"></span>

          <div class="avatar__frame">
            <!-- 头像文件：Fa-HT.png，与本文件同级目录 -->
            <img class="avatar__img" src="Fa-HT.png" alt="Fa-HT 的头像" width="260" height="260" decoding="async">
            <span class="avatar__fallback" aria-hidden="true">Fa-HT</span>
          </div>
        </div>
      </figure>

      <h1 class="name">Fa-HT</h1>
    </section>
  </main>

  <script>
    // 头像文件还没放进来时，自动显示渐变底 + 名字，避免出现破图图标
    (function () {
      var avatar = document.querySelector('.avatar');
      var img = document.querySelector('.avatar__img');

      function showFallback() {
        avatar.classList.add('is-missing');
      }

      img.addEventListener('error', showFallback);
      if (img.complete && img.naturalWidth === 0) showFallback();
    })();

    // 背景视频：自动播放失败时重试；系统开启“减少动态效果”时暂停
    (function () {
      var v = document.querySelector('.bg-video');
      if (!v) return;

      v.muted = true;

      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        v.removeAttribute('autoplay');
        v.pause();
        return;
      }

      function play() {
        var p = v.play();
        if (p && p.catch) p.catch(function () {});
      }

      play();
      v.addEventListener('canplay', play, { once: true });
    })();

    // 模糊区块的位置 / 大小调节
    //   setBand(20, 80)                        -> 左边线 20%、右边线 80%（数字=视口宽度百分比）
    //   setBand('320px', '960px')              -> 也可直接给带单位的 CSS 长度
    //   setBandBox({ top: 5, bottom: 5 })      -> 纵向位置（数字=视口高度百分比）
    //   setBandSize(40, 90, 30, 5)             -> 宽 40%、高 90%、左 30%、上 5%
    //   getBandBox()                           -> 读取 { left, right, top, bottom }
    //   resetBand()                            -> 恢复 style.css 里的默认值
    window.setBand = function (left, right) {
      var root = document.documentElement;

      function toCss(v) {
        return typeof v === 'number' ? Math.max(0, Math.min(100, v)) + '%' : String(v);
      }

      if (left !== undefined && left !== null) root.style.setProperty('--band-left', toCss(left));
      if (right !== undefined && right !== null) root.style.setProperty('--band-right', toCss(right));
      return window.getBandBox();
    };

    window.setBandBox = function (box) {
      var root = document.documentElement;

      function toCss(v) {
        return typeof v === 'number' ? Math.max(0, Math.min(100, v)) + '%' : String(v);
      }

      if (!box) return window.getBandBox();
      if (box.left != null) root.style.setProperty('--band-left', toCss(box.left));
      if (box.right != null) root.style.setProperty('--band-right', toCss(box.right));
      if (box.top != null) root.style.setProperty('--band-top', toCss(box.top));
      if (box.bottom != null) root.style.setProperty('--band-bottom', toCss(box.bottom));
      return window.getBandBox();
    };

    // 用「宽 + 高 + 左 + 上」来定：数字都是百分比
    window.setBandSize = function (width, height, left, top) {
      left = left == null ? 0 : left;
      top = top == null ? 0 : top;
      return window.setBandBox({
        left: left,
        right: left + width,
        top: top,
        bottom: top + height
      });
    };

    window.getBandBox = function () {
      var cs = getComputedStyle(document.documentElement);
      return {
        left: cs.getPropertyValue('--band-left').trim(),
        right: cs.getPropertyValue('--band-right').trim(),
        top: cs.getPropertyValue('--band-top').trim(),
        bottom: cs.getPropertyValue('--band-bottom').trim()
      };
    };

    window.resetBand = function () {
      var root = document.documentElement;
      root.style.removeProperty('--band-left');
      root.style.removeProperty('--band-right');
      root.style.removeProperty('--band-top');
      root.style.removeProperty('--band-bottom');
      return window.getBandBox();
    };

    // 模糊带内的界面切换：主界面 ⇄ 下载界面（只在带内变化）
    (function () {
      var inner = document.getElementById('uiBandInner');
      var enter = document.getElementById('dlEnter');
      var back = document.getElementById('dlBack');
      var mainView = document.getElementById('dlMainView');
      var dlView = document.getElementById('dlView');
      if (!inner || !enter || !back) return;

      function showDownload(on) {
        inner.classList.toggle('is-download', on);
        document.body.classList.toggle('is-download-page', on);
        enter.setAttribute('aria-expanded', on ? 'true' : 'false');
        if (mainView) mainView.setAttribute('aria-hidden', on ? 'true' : 'false');
        if (dlView) dlView.setAttribute('aria-hidden', on ? 'false' : 'true');

        var target = on ? back : enter;
        window.requestAnimationFrame(function () {
          if (inner.classList.contains('is-download') === on) {
            target.focus({ preventScroll: true });
          }
        });
      }

      enter.addEventListener('click', function () {
        showDownload(true);
      });

      back.addEventListener('click', function () {
        showDownload(false);
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && inner.classList.contains('is-download')) {
          showDownload(false);
        }
      });
    })();
  </script>

</body>
</html>
